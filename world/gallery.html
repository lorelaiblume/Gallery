<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Lorelai Blume</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #eef0f3;
                 font-family: -apple-system, Segoe UI, Karla, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
               font-size: 14px; color: #6a6478; }
    .caption { position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      z-index: 10; color: #4a4458; font-size: 12px; letter-spacing: .04em;
      background: rgba(255,255,255,0.55); padding: 6px 14px; border-radius: 20px; }
    .home { position: fixed; left: 18px; bottom: 14px; z-index: 20;
      color: #3a3444; text-decoration: none; font-size: 0.72rem;
      letter-spacing: 0.18em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(255,255,255,.6); }
    .home:hover { color: #000; }
    #wipe { position: fixed; inset: 0; background:#fff; z-index: 40; opacity: 1;
      animation: fadeout 0.9s ease forwards; pointer-events: none; }
    @keyframes fadeout { to { opacity: 0; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="caption">drag to look · W / S to walk · A / D to turn</div>
  <a class="home" href="roam.html">← back to the world</a>
  <div id="wipe"></div>

  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  } }
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  const dom = renderer.domElement;
  document.getElementById('app').appendChild(dom);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0c);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.05, 400);
  camera.rotation.order = 'YXZ';

  // ── the room: black walls + ceiling ──
  const W = 90, D = 90, H = 26, EYE = 4.5;
  const room = new THREE.Mesh(new THREE.BoxGeometry(W, H, D),
    new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.85, metalness: 0, side: THREE.BackSide }));
  room.position.y = H/2; room.receiveShadow = true; scene.add(room);

  // ── white marble floor ──
  function marbleTexture(){
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d');
    g.fillStyle = '#f3f3f1'; g.fillRect(0,0,1024,1024);
    // soft grey clouding
    for (let i = 0; i < 46; i++){
      g.fillStyle = `rgba(205,207,212,${0.03 + Math.random()*0.05})`;
      g.beginPath(); g.arc(Math.random()*1024, Math.random()*1024, 90 + Math.random()*240, 0, 7); g.fill();
    }
    // veins
    for (let v = 0; v < 16; v++){
      const grey = 150 + Math.random()*45|0;
      g.strokeStyle = `rgba(${grey},${grey},${grey+6},${0.2 + Math.random()*0.3})`;
      g.lineWidth = 1 + Math.random()*2.4; g.beginPath();
      let x = Math.random()*1024, y = Math.random()*1024; g.moveTo(x, y);
      const steps = 8 + Math.random()*10;
      for (let s = 0; s < steps; s++){ x += (Math.random()-0.5)*270; y += (Math.random()-0.5)*270; g.lineTo(x, y); }
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    return t;
  }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D),
    new THREE.MeshStandardMaterial({ map: marbleTexture(), roughness: 0.18, metalness: 0.0 }));
  floor.rotation.x = -Math.PI/2; floor.position.y = 0.02; floor.receiveShadow = true; scene.add(floor);

  // ── art on the walls (digital pieces, with titles) ──
  const ART = [
    { title: "Juice Pop", src: "gallery-art/juice-pop.jpg" },                             // right wall
    { title: "Rainbow Sherbert", src: "gallery-art/rainbow-sherbert.jpg" },               // right wall
    { title: "Squiggles Stripes & Stars", src: "gallery-art/squiggles-stripes-stars.jpg" }, // front wall
    { title: "Frootie Tootie", src: "gallery-art/frootie-tootie.jpg" },                   // front wall
    { title: "Bubble Bath", src: "gallery-art/bubble-bath.jpg" },                         // left wall — left of the guy
    { title: "Skater Guy", src: "gallery-art/skater-guy.png" },                           // left wall — center
    { title: "Finished Piece", src: "gallery-art/finished-piece.png" },                   // left wall — right of the guy
  ];
  const HCENTER = 13, ARTH = 22;               // every piece is this tall → equal small gap top & bottom
  const texLoader = new THREE.TextureLoader();

  function makeLabel(text){
    const c = document.createElement('canvas'); c.width = 640; c.height = 140;
    const g = c.getContext('2d');
    g.fillStyle = '#2a2530'; g.font = '600 46px -apple-system, Segoe UI, Karla, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 320, 74);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.0),
      new THREE.MeshBasicMaterial({ map: t, transparent: true }));
    return m;
  }

  function hang(a, x, z, ry){
    const g = new THREE.Group(); g.position.set(x, HCENTER, z); g.rotation.y = ry; scene.add(g);
    texLoader.load(a.src, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
      const asp = tex.image.width / tex.image.height;
      const ah = ARTH, aw = ARTH * asp;    // same height for all; width follows the image
      const art = new THREE.Mesh(new THREE.PlaneGeometry(aw, ah),
        new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));   // true, vivid colors
      art.position.z = 0.06; g.add(art);
    });
  }

  // lay the pieces around the four walls (round-robin), inward-facing
  (function hangAll(){
    const halfW = W/2 - 0.25, halfD = D/2 - 0.25;
    const walls = [
      { fixed: 'z', at: -halfD, ry: 0 },          // back
      { fixed: 'x', at:  halfW, ry: -Math.PI/2 },  // right
      { fixed: 'z', at:  halfD, ry: Math.PI },     // front
      { fixed: 'x', at: -halfW, ry: Math.PI/2 },   // left
    ];
    const layout = [0, 2, 2, 3];                   // back: message only · right: 2 · front: 2 · left: purple + guy + rainbow
    let idx = 0;
    walls.forEach((wall, w) => {
      const n = layout[w];
      const span = (wall.fixed === 'z' ? W : D) - 8;
      for (let j = 0; j < n && idx < ART.length; j++){
        const t = n === 1 ? 0.5 : (j + 0.5) / n;
        const u = -span/2 + t*span;
        const a = ART[idx++];
        if (wall.fixed === 'z') hang(a, u, wall.at, wall.ry);
        else                    hang(a, wall.at, u, wall.ry);
      }
    });
  })();

  // ── welcome message, plain white text on the back wall ──
  (function wallText(){
    const text = "Hi! Welcome to my art gallery. This gallery displays original pieces I've created digitally using Procreate. Enjoy!";
    const cw = 1024, ch = 560;
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '500 58px -apple-system, Segoe UI, Karla, sans-serif';
    const maxW = cw - 120, words = text.split(' '), lines = []; let line = '';
    for (const w of words){
      const test = line ? line + ' ' + w : w;
      if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test;
    }
    if (line) lines.push(line);
    const lh = 78, total = lines.length * lh; let y = ch/2 - total/2 + lh/2;
    for (const ln of lines){ g.fillText(ln, cw/2, y); y += lh; }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    const pw = 22, ph = pw * (ch/cw);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph),
      new THREE.MeshBasicMaterial({ map: t, transparent: true }));
    m.position.set(0, 13, -(D/2 - 0.25) + 0.06);   // back wall, between the two portraits
    scene.add(m);
  })();

  // ── lighting ──
  scene.add(new THREE.HemisphereLight(0xffffff, 0xdcdce4, 0.9));
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const key = new THREE.DirectionalLight(0xffffff, 0.7);
  key.position.set(10, 30, 12); key.castShadow = true;
  key.shadow.mapSize.set(1024,1024); key.shadow.camera.near = 1; key.shadow.camera.far = 90;
  key.shadow.camera.left=-55; key.shadow.camera.right=55; key.shadow.camera.top=55; key.shadow.camera.bottom=-55;
  scene.add(key);
  for (const x of [-30, 0, 30]) for (const z of [-25, 25]){
    const s = new THREE.PointLight(0xfff3e0, 55, 90, 2); s.position.set(x, H-2, z); scene.add(s);
  }

  // ── camera state: drag to look, WASD to walk ──
  camera.position.set(0, EYE, D/2 - 6);
  let yaw = 0, pitch = 0;                 // yaw 0 faces into the room (−z)

  let dragging = false, lx = 0, ly = 0;
  dom.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; dom.classList.add('dragging'); });
  addEventListener('mouseup',   () => { dragging = false; dom.classList.remove('dragging'); });
  addEventListener('mousemove', e => {
    if (!dragging) return;
    yaw   -= (e.clientX - lx) * 0.0026;
    pitch -= (e.clientY - ly) * 0.0026;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
    lx = e.clientX; ly = e.clientY;
  });
  // touch drag
  dom.addEventListener('touchstart', e => { const t=e.touches[0]; dragging=true; lx=t.clientX; ly=t.clientY; }, {passive:true});
  addEventListener('touchend', () => dragging = false);
  addEventListener('touchmove', e => {
    if (!dragging) return; const t = e.touches[0];
    yaw -= (t.clientX - lx) * 0.004; pitch -= (t.clientY - ly) * 0.004;
    pitch = Math.max(-1.2, Math.min(1.2, pitch)); lx = t.clientX; ly = t.clientY;
  }, {passive:true});

  const keys = {};
  addEventListener('keydown', e => { keys[e.code] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); });
  addEventListener('keyup',   e => { keys[e.code] = false; });

  const SPEED = 20, TURN = 1.9, clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());

    let f = 0, turn = 0;
    if (keys.KeyW || keys.ArrowUp)    f += 1;
    if (keys.KeyS || keys.ArrowDown)  f -= 1;
    if (keys.KeyA || keys.ArrowLeft)  turn += 1;   // turn left
    if (keys.KeyD || keys.ArrowRight) turn -= 1;   // turn right
    yaw += turn * TURN * dt;
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    camera.position.addScaledVector(fwd, f * SPEED * dt);
    camera.position.x = Math.max(-W/2 + 1.5, Math.min(W/2 - 1.5, camera.position.x));
    camera.position.z = Math.max(-D/2 + 1.5, Math.min(D/2 - 1.5, camera.position.z));
    camera.position.y = EYE;

    camera.rotation.y = yaw; camera.rotation.x = pitch;
    renderer.render(scene, camera);
  }
  animate();
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
