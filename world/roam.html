<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roam — Lorelai Blume</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f9e0ef;
                 font-family: -apple-system, Segoe UI, Karla, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
               font-size: 14px; color: #a24b7d; background: #f9e0ef;
               transition: opacity 0.35s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    .caption { position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
      z-index: 10; color: #a24b7d; font-size: 13px; letter-spacing: .03em; background: rgba(255,255,255,0.5);
      padding: 6px 14px; border-radius: 20px; }
    .home { position: fixed; left: 16px; bottom: 14px; z-index: 20;
      color: #b56a95; text-decoration: none; font-size: 0.72rem;
      letter-spacing: 0.18em; text-transform: uppercase; }
    canvas { touch-action: none; }
    #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      background: rgba(255,255,255,0.35); border: 2px solid rgba(162,75,125,0.35); z-index: 15;
      pointer-events: none; display: none; }
    #stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%; background: rgba(162,75,125,0.55); }
    #jumpBtn { position: fixed; right: 22px; bottom: 26px; z-index: 15; width: 72px; height: 72px;
      border-radius: 50%; border: 0; background: rgba(162,75,125,0.55); color: #fff;
      font: 700 13px/1 -apple-system, sans-serif; letter-spacing: .05em; display: none; }
    @media (pointer: coarse) { #jumpBtn { display: block; } }
    #stylePanel { position: fixed; right: 22px; top: 50%; width: 250px; z-index: 25; padding: 18px 18px 14px;
      transform: translate(calc(100% + 40px), -50%); transition: transform .45s cubic-bezier(.2,.9,.3,1.2);
      background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 22px; box-shadow: 0 10px 40px rgba(162,75,125,0.25); color: #a24b7d; }
    #stylePanel.open { transform: translate(0, -50%); }
    #stylePanel h2 { margin: 0 0 12px; font: 700 18px/1.1 Georgia, serif; text-align: center; letter-spacing: .02em; }
    #stylePanel .sec { margin-bottom: 14px; }
    #stylePanel .sec > span { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 7px; opacity: .8; }
    #stylePanel .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    #stylePanel .sw { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer; padding: 0; }
    #stylePanel .sw.on { outline: 3px solid #a24b7d; outline-offset: 1px; }
    #stylePanel .sw.custom { background: conic-gradient(#ff6fae, #f6b74a, #a9e05a, #56c5f1, #b58cff, #ff6fae); position: relative; overflow: hidden; }
    #stylePanel .sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    #stylePanel .opts { display: flex; flex-wrap: wrap; gap: 6px; }
    #stylePanel .opt { border: 0; border-radius: 999px; padding: 6px 11px; font: 600 12px/1 -apple-system, sans-serif;
      background: rgba(162,75,125,0.12); color: #a24b7d; cursor: pointer; }
    #stylePanel .opt.on { background: #a24b7d; color: #fff; }
    #styleDone { width: 100%; border: 0; border-radius: 999px; padding: 10px; margin-top: 4px; cursor: pointer;
      background: linear-gradient(90deg, #ff6fae, #b58cff); color: #fff; font: 700 14px/1 -apple-system, sans-serif; }
    #stylePanel .hint { margin: 7px 0 0; font-size: 11px; text-align: center; opacity: .65; }
    @media (max-width: 700px) {
      #stylePanel { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; transform: translateY(calc(100% + 30px)); }
      #stylePanel.open { transform: translateY(0); }
      #stylePanel .swatches { grid-template-columns: repeat(11, 1fr); }
    }
    #musicPanel { position: fixed; left: 16px; bottom: 40px; width: 340px; max-width: calc(100vw - 32px); z-index: 24;
      background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 18px; box-shadow: 0 10px 40px rgba(162,75,125,0.25); padding: 8px 8px 8px; color: #a24b7d;
      transform: translateY(calc(100% + 60px)); transition: transform .45s cubic-bezier(.2,.9,.3,1.2); }
    #musicPanel.open { transform: translateY(0); }
    #musicPanel .mhead { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 7px;
      font: italic 700 15px/1 Georgia, serif; }
    #musicPanel .mhead button { border: 0; background: rgba(162,75,125,0.12); color: #a24b7d; width: 24px; height: 24px;
      border-radius: 50%; margin-left: 5px; cursor: pointer; font: 700 14px/1 -apple-system, sans-serif; }
    #mBody { border-radius: 12px; overflow: hidden; min-height: 80px; }
    #mBody iframe { display: block; border: 0; }
    #goalPop { position: fixed; left: 50%; top: 32%; z-index: 30; pointer-events: none; opacity: 0;
      transform: translate(-50%, -50%) scale(0.4); font: italic 900 96px/1 Georgia, serif; letter-spacing: .04em;
      background: linear-gradient(90deg, #ff6fae, #f6d04a, #a9e05a, #56c5f1, #b58cff); -webkit-background-clip: text; background-clip: text;
      color: transparent; filter: drop-shadow(0 4px 0 rgba(255,255,255,0.9)) drop-shadow(0 8px 18px rgba(162,75,125,0.35)); }
    #goalPop.show { animation: goalPop 2s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes goalPop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.4) rotate(-8deg); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1) rotate(3deg); } 30% { transform: translate(-50%,-50%) scale(1) rotate(0); }
      80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1); } }
    #hintBubble { position: fixed; left: 50%; bottom: 58px; z-index: 21; max-width: min(560px, calc(100vw - 32px));
      transform: translate(-50%, 12px); opacity: 0; transition: opacity .35s ease, transform .35s ease; pointer-events: none;
      background: rgba(255,255,255,0.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: #a24b7d; font: 500 14px/1.35 -apple-system, "Segoe UI", sans-serif; text-align: center;
      padding: 10px 18px; border-radius: 999px; box-shadow: 0 8px 26px rgba(162,75,125,0.22); }
    #hintBubble.show { opacity: 1; transform: translate(-50%, 0); }
    #muteBtn { position: fixed; right: 16px; top: 12px; z-index: 22; width: 38px; height: 38px; border-radius: 50%;
      border: 0; background: rgba(255,255,255,0.55); font-size: 17px; line-height: 1; cursor: pointer; }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease; z-index: 50; }
    /* rocket launch: slow fade to black, and the on-screen controls get out of the way */
    #blackout { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none;
      transition: opacity 1.8s ease-in; z-index: 60; }
    body.launching .caption, body.launching .home, body.launching #jumpBtn, body.launching #stick {
      opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Waking up the dog…</div>
  <div class="caption" id="caption">WASD to walk · shift to run · drag to look around · space to jump · scroll to zoom · V: overview</div>
  <div id="stick"><i></i></div>
  <button id="jumpBtn">JUMP</button>
  <button id="muteBtn">🔊</button>
  <div id="goalPop">GOAL!</div>
  <div id="hintBubble"></div>
  <div id="musicPanel" aria-hidden="true">
    <div class="mhead"><span>♪ lorelai fm</span><span><button id="mMin" title="shrink / expand">–</button><button id="mClose" title="turn the music off">×</button></span></div>
    <div id="mBody"></div>
  </div>
  <div id="stylePanel" aria-hidden="true">
    <h2>style your pup</h2>
    <div class="sec"><span>color</span><div class="swatches" id="swatches"></div></div>
    <div class="sec"><span>finish</span><div class="opts" id="finishOpts"></div></div>
    <div class="sec"><span>accessory</span><div class="opts" id="hatOpts"></div></div>
    <button id="styleDone">done ✓</button>
    <p class="hint">or just walk away</p>
  </div>
  <a class="home" href="/">← Lorelai Blume</a>
  <div id="flash"></div>
  <div id="blackout"></div>

  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  } }
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

  // ── loading: one shared manager, so the overlay lifts only once EVERY model is in ──
  const loadManager = new THREE.LoadingManager();
  let introClock = -1;                      // < 0: waiting for models; then seconds into the intro
  loadManager.onLoad = () => {
    introClock = 0;
    // wait one frame so the first render (with everything in place) happens under the overlay
    requestAnimationFrame(() => document.getElementById('loading').classList.add('done'));
  };
  loadManager.onError = (url) => console.error('Failed to load', url);
  function makeLoader(){
    const l = new GLTFLoader(loadManager);
    l.setMeshoptDecoder(MeshoptDecoder);   // rocket.glb is meshopt-compressed
    return l;
  }

  // ── renderer / scene ──
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('app').appendChild(renderer.domElement);

  const PINK = 0xf05080;      // the dish
  const SPACE = 0xf9e0ef;     // pale-pink empty space around it
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 3, 2200);
  camera.position.set(0, 8, 14);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xe7b9d6, 0.9));
  const sun = new THREE.DirectionalLight(0xfff4ea, 1.25);
  sun.position.set(30, 50, 20); sun.castShadow = true;
  sun.shadow.mapSize.set(4096,4096);
  sun.shadow.camera.near = 5; sun.shadow.camera.far = 600;
  sun.shadow.camera.left=-190; sun.shadow.camera.right=190; sun.shadow.camera.top=190; sun.shadow.camera.bottom=-190;
  sun.shadow.bias = -0.0004; scene.add(sun); scene.add(sun.target);
  const SUN_OFF = new THREE.Vector3(30, 50, 20).normalize().multiplyScalar(250);   // sun + shadow box follow the dog

  // ── the dish: a small finite pink disk floating in the pale-pink void ──
  const DISH_R = 110, DISH_TH = 12;
  const dish = new THREE.Group();
  const dishTop = new THREE.Mesh(
    new THREE.CircleGeometry(DISH_R, 96),
    new THREE.MeshBasicMaterial({ color: PINK }));
  dishTop.rotation.x = -Math.PI/2; dishTop.name = 'floor'; dish.add(dishTop);
  const dishSide = new THREE.Mesh(
    new THREE.CylinderGeometry(DISH_R, DISH_R, DISH_TH, 96, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xd23f6d, side: THREE.DoubleSide }));  // darker rim = depth
  dishSide.position.y = -DISH_TH/2; dishSide.name = 'rim'; dish.add(dishSide);
  const dishBottom = new THREE.Mesh(
    new THREE.CircleGeometry(DISH_R, 96),
    new THREE.MeshBasicMaterial({ color: 0xc23a64 }));
  dishBottom.rotation.x = Math.PI/2; dishBottom.position.y = -DISH_TH; dishBottom.name = 'under'; dish.add(dishBottom);
  scene.add(dish);

  // ================= atmosphere: sky + fog =================
  const SKY_TOP = new THREE.Color(0xc9d3ff), SKY_HORIZON = new THREE.Color(SPACE), SKY_BELOW = new THREE.Color(0xf3c6de);
  scene.background = SKY_HORIZON.clone();
  scene.fog = new THREE.Fog(SKY_HORIZON, 200, 900);      // near/far re-tuned every frame from the camera distance
  {
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(1900, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: { top: { value: SKY_TOP }, horizon: { value: SKY_HORIZON }, below: { value: SKY_BELOW } },
        vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform vec3 top, horizon, below; varying vec3 vDir; void main(){
          float h = vDir.y;
          vec3 c = h > 0.0 ? mix(horizon, top, pow(smoothstep(0.0, 0.75, h), 0.8))
                           : mix(horizon, below, smoothstep(0.0, 0.6, -h));
          gl_FragColor = vec4(c, 1.0); }`
      }));
    sky.renderOrder = -1; sky.frustumCulled = false; sky.name = 'sky'; scene.add(sky);
    // keep the sky centred on the camera so you can never reach its edge
    sky.onBeforeRender = (r, sc, cam) => sky.position.copy(cam.position);
  }

  function updateAtmosphere(dt, t, camDistNow){
    // fog follows the zoom: gentle haze in the play view, still clear in the overview
    scene.fog.near = camDistNow * 0.9 + 140;
    scene.fog.far  = camDistNow * 1.3 + 950;
    waterUniforms.time.value = t;
  }

  // soft contact shadow on the dish top
  const shadowCatcher = new THREE.Mesh(
    new THREE.CircleGeometry(DISH_R, 96),
    new THREE.ShadowMaterial({ opacity: 0.13 }));
  shadowCatcher.rotation.x = -Math.PI/2; shadowCatcher.position.y = 0.05;
  shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);

  // ── loop path around the edge of the dish (walk around to visit what we place) ──
  const PATH_R = DISH_R - 24, PATH_W = 28;
  (function buildLoopPath(){
    const COLORS = [0x6a86ef, 0x56c5f1, 0xa9e05a, 0xf6b74a, 0xf0794c, 0xef5566]; // periwinkle→red
    const inner = PATH_R - PATH_W/2, band = PATH_W / COLORS.length;
    COLORS.forEach((hex, i) => {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(inner + band*i, inner + band*(i+1), 160),
        new THREE.MeshBasicMaterial({ color: hex, toneMapped: false }));
      ring.rotation.x = -Math.PI/2;
      ring.position.y = 0.12;
      scene.add(ring);
    });
  })();

  // ── marker halos (placeholders for what we'll add later) ──
  // 5 evenly spaced on the rim + 1 in the center. They gently pulse/glow.
  const halos = [];
  const HALO_R = DISH_R * 0.055;   // scales with the dish
  (function buildHalos(){
    function makeHalo(x, z){
      const g = new THREE.Group();
      g.position.set(x, 0.25, z);
      const core = new THREE.Mesh(
        new THREE.RingGeometry(HALO_R*0.62, HALO_R, 64),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9,
          blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
      core.rotation.x = -Math.PI/2; g.add(core);
      const glow = new THREE.Mesh(
        new THREE.RingGeometry(HALO_R, HALO_R*1.85, 64),
        new THREE.MeshBasicMaterial({ color: 0xffd9f2, transparent: true, opacity: 0.32,
          blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
      glow.rotation.x = -Math.PI/2; g.add(glow);
      scene.add(g);
      halos.push({ grp: g, core, glow, phase: Math.random()*Math.PI*2 });
    }
    makeHalo(0, 0);                                  // center
    for (let i = 0; i < 5; i++){                     // evenly spaced on the loop path
      if (i === 4) continue;                          // #4 = balloon lab
      const a = (i/5)*Math.PI*2 - Math.PI/2;         // first one at the top
      makeHalo(Math.cos(a)*PATH_R, Math.sin(a)*PATH_R);
    }
  })();

  // ── rainbow spoke paths: flat, same width as the loop, from center out to each rim halo ──
  //    inner ends fan onto a circular arc so they wrap cleanly around the center halo,
  //    and the inner clearing is wide enough that the five spokes never overlap each other.
  (function buildSpokes(){
    const COLORS = [0x6a86ef, 0x56c5f1, 0xa9e05a, 0xf6b74a, 0xf0794c, 0xef5566]; // periwinkle→red
    const W = PATH_W;                     // match the loop path width
    const INNER = HALO_R * 3.3;           // rounded clearing radius around the center halo
    const rOuter = PATH_R - HALO_R * 1.9; // stop just short of the rim halo
    const y = 0.12, SUBU = 4;             // sub-samples per colour band → smooth inner arc
    function spoke(a){
      const d = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
      const perp = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), d).normalize();
      // inner cap rides the center circle (radius INNER) but keeps the side edges parallel,
      // so the spoke is a straight constant-width road — no bowtie/hourglass.
      const innerPt = o => d.clone().multiplyScalar(Math.sqrt(Math.max(0, INNER*INNER - o*o)))
                            .addScaledVector(perp, o);
      const outerPt = o => d.clone().multiplyScalar(rOuter).addScaledVector(perp, o);
      const laneW = W / COLORS.length, pos = [], col = [], tmp = new THREE.Color();
      for (let k=0;k<COLORS.length;k++){
        tmp.setHex(COLORS[k]);
        for (let s=0;s<SUBU;s++){
          const o0 = -W/2 + (k + s/SUBU)*laneW, o1 = -W/2 + (k + (s+1)/SUBU)*laneW;
          const i0 = innerPt(o0), i1 = innerPt(o1), q0 = outerPt(o0), q1 = outerPt(o1);
          pos.push(i0.x,y,i0.z, i1.x,y,i1.z, q1.x,y,q1.z, i0.x,y,i0.z, q1.x,y,q1.z, q0.x,y,q0.z);
          for (let n=0;n<6;n++) col.push(tmp.r,tmp.g,tmp.b);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
      g.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(col),3));
      const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
        vertexColors:true, toneMapped:false, side:THREE.DoubleSide }));
      scene.add(mesh);
    }
    // spokes removed on the big dish (only the outer loop stays); kept the builder in case we want one back
    // for (let i = 0; i < 5; i++){ const a = (i/5)*Math.PI*2 - Math.PI/2; spoke(a); }
  })();

  // ================= portal island: rocket, popcorn + palette, reached by a rainbow bridge =================
  const BRIDGE_A = (2/5)*Math.PI*2 - Math.PI/2;             // the bridge continues spoke #2 off the big dish
  const BRIDGE_DIR = new THREE.Vector3(Math.cos(BRIDGE_A), 0, Math.sin(BRIDGE_A));
  const ISLE_R = 110, GAP = 110, ISLE_PATH_R = 62;
  const ISLE_C = BRIDGE_DIR.clone().multiplyScalar(DISH_R + GAP + ISLE_R);
  const HEADING0 = Math.atan2(BRIDGE_DIR.x, BRIDGE_DIR.z);   // the dog spawns facing the bridge
  // the three portals sit in a semicircle on the island's loop, across from the bridge.
  // angle 0 = straight across; negative = left, positive = right (as you walk off the bridge)
  const ARC = 1.55;                                          // ~89° between neighbours (popcorn + rocket out to the sides)
  const SPOT_R = 72;                                         // a bit further out than the loop's centre line
  const SPOT = { popcorn: -ARC, palette: 0, rocket: ARC };
  function isleSpot(phi){
    const a = BRIDGE_A + phi;
    return new THREE.Vector3(ISLE_C.x + Math.cos(a)*SPOT_R, 0, ISLE_C.z + Math.sin(a)*SPOT_R);
  }
  // where the bridge meets the island's loop — everything turns to face this spot
  const ISLE_ENTRY = ISLE_C.clone().addScaledVector(BRIDGE_DIR, -(ISLE_PATH_R + PATH_W/2));
  const yawToward = (from, to) => Math.atan2(to.x - from.x, to.z - from.z);   // rotation.y that points local +z at `to`
  const RAINBOW = [0x6a86ef, 0x56c5f1, 0xa9e05a, 0xf6b74a, 0xf0794c, 0xef5566]; // periwinkle→red

  const isleTop = (function buildIsland(){
    const g = new THREE.Group(); g.position.copy(ISLE_C);
    const top = new THREE.Mesh(new THREE.CircleGeometry(ISLE_R, 96), new THREE.MeshBasicMaterial({ color: PINK }));
    top.rotation.x = -Math.PI/2; top.name = 'floor'; g.add(top);
    const side = new THREE.Mesh(new THREE.CylinderGeometry(ISLE_R, ISLE_R, DISH_TH, 96, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xd23f6d, side: THREE.DoubleSide }));
    side.position.y = -DISH_TH/2; side.name = 'rim'; g.add(side);
    const bottom = new THREE.Mesh(new THREE.CircleGeometry(ISLE_R, 96), new THREE.MeshBasicMaterial({ color: 0xc23a64 }));
    bottom.rotation.x = Math.PI/2; bottom.position.y = -DISH_TH; bottom.name = 'under'; g.add(bottom);
    const catcher = new THREE.Mesh(new THREE.CircleGeometry(ISLE_R, 96), new THREE.ShadowMaterial({ opacity: 0.13 }));
    catcher.rotation.x = -Math.PI/2; catcher.position.y = 0.05; catcher.receiveShadow = true; g.add(catcher);
    const inner = ISLE_PATH_R - PATH_W/2, band = PATH_W / RAINBOW.length;
    RAINBOW.forEach((hex, i) => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(inner + band*i, inner + band*(i+1), 128),
        new THREE.MeshBasicMaterial({ color: hex, toneMapped: false }));
      ring.rotation.x = -Math.PI/2; ring.position.y = 0.12; g.add(ring);
    });
    scene.add(g);
    return top;
  })();

  // rainbow bridge: flat across the big dish's rim, a gentle arch over the gap, flat again onto the island's loop

  function meadowSpot(x, z){                                     // anywhere on the park, except where the bridge lands

        walkT += dt * 13 * Math.max(0.6, Math.abs(move)) * (running && move ? 1.6 : 1); deformWalk();
        const st = Math.floor(walkT / Math.PI);                     // two paw-steps per stride → squeak
        if (st !== lastStep){ lastStep = st; sfx.squeak(running && move); }
      }
      else if (restPos){ restoreRest(); }

      // climb physics: follow the surface under the dog (dish floor, or up onto the palette)
      const walk = [dishTop, isleTop, bridgeTop, parkTop, parkBridgeTop, triBridgeTop, ...stationWalk, ...themeCaps]; if (paletteObj) walk.push(paletteObj);
      downRay.set(_downOrigin.set(dogRig.position.x, 300, dogRig.position.z), _down);
      let hit = downRay.intersectObjects(walk, true)[0];
      if (!hit){
        // nothing to stand on here (edge of a dish or the bridge) → don't take that step
        dogRig.position.x = prevX; dogRig.position.z = prevZ;
        downRay.set(_downOrigin.set(prevX, 300, prevZ), _down);
        hit = downRay.intersectObjects(walk, true)[0];
      }
      if (hit) groundY = hit.point.y; else if (!airborne) groundY = dogRig.position.y;
      if (!introDone) wantJump = false;
      if (wantJump && !airborne){ airborne = true; vy = JUMP_V; sfx.boing(); }
      wantJump = false;
      if (airborne){
        dogRig.position.y += vy * dt; vy -= GRAVITY * dt;
        const floor = hit ? hit.point.y : groundY;
        if (vy < 0 && dogRig.position.y <= floor){ dogRig.position.y = floor; airborne = false; vy = 0; sfx.thump(); }
      } else if (hit) dogRig.position.y += (hit.point.y - dogRig.position.y) * Math.min(1, dt*10);
    }

    // popcorn portal: door stays shut until you're close, then swings open fast;
    // walk into the white light to get transported.
    if (popcornDoor){
      const dx = dogRig.position.x - popcornEntry.x, dz = dogRig.position.z - popcornEntry.z;
      const dist = Math.hypot(dx, dz);
      const OPEN = 48, TOUCH = 13;
      const wantOpen = dist < OPEN ? 1 : 0;
      popcornDoor.rotation.y = THREE.MathUtils.lerp(popcornDoor.rotation.y, -wantOpen * Math.PI * 0.62, 0.3);
      if (popcornGlow){
        popcornGlow.material.opacity = THREE.MathUtils.lerp(popcornGlow.material.opacity, wantOpen*0.95, 0.3);
        const halo = popcornGlow.userData.halo;
        if (halo) halo.material.opacity = THREE.MathUtils.lerp(halo.material.opacity, wantOpen*0.5, 0.3);
      }
      if (!portalTriggered && dist < TOUCH){ portalTriggered = true; enterPortal(); }
    }

    // palette portal: pulse the glowing blue paint; step on it to enter the gallery
    if (paletteGlow){
      const p = 0.5 + 0.5*Math.sin(elapsed*2.5);
      paletteGlow.emissiveIntensity = 2.4 + 2.6*p;   // pulsing neon, cranked
      if (!galleryTriggered && dogMesh){
        const dx = dogRig.position.x - palettePortal.x, dz = dogRig.position.z - palettePortal.z;
        if (dx*dx + dz*dz < 13*13){ galleryTriggered = true; enterGallery(); }
      }
    }

    // rocket: step on its halo to launch; while launching, the launch drives the dog + camera
    if (!launch && rocketHalo && introDone && dogMesh && !styleMode &&
        Math.hypot(dogRig.position.x - rocketHaloPos.x, dogRig.position.z - rocketHaloPos.z) < HALO_R * 1.25){ startLaunch(); }
    if (launch) runLaunch(dt);

    // follow camera: sits behind the dog (heading + π) plus any drag look-around
    if (introDone && !launch){
      const want = heading + (styleMode ? 0 : Math.PI) + yawOffset;
      let d = want - camYaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      camYaw += d * (1 - Math.exp(-dt * 8));
    }
    const ease = 1 - Math.exp(-dt * 4);
    camDist  += (camDistT  - camDist)  * ease;
    camPitch += (camPitchT - camPitch) * ease;
    styleShift += ((styleMode && innerWidth > 700 ? 4.5 : 0) - styleShift) * ease;
    _dir.set(dogRig.position.x + Math.cos(camYaw)*styleShift, dogRig.position.y + 4, dogRig.position.z - Math.sin(camYaw)*styleShift);
    if (!launch){
      camTarget.lerp(_dir, 1 - Math.exp(-dt * 10));
      const hz = Math.cos(camPitch) * camDist;
      camera.position.set(camTarget.x + Math.sin(camYaw)*hz, camTarget.y + Math.sin(camPitch)*camDist, camTarget.z + Math.cos(camYaw)*hz);
      camera.lookAt(camTarget);
    }
    sun.target.position.copy(dogRig.position); sun.position.copy(dogRig.position).add(SUN_OFF);
    updateAtmosphere(dt, elapsed, camDist);
    for (const u of stationUpdaters) u(dt, elapsed);
    updateReinflate(dt);
    updateBall(dt);

    updateThemeTriggers();
    { let tip = null; if (introDone && !styleMode) for (const h of hintSpots)
        if (Math.hypot(dogRig.position.x - h.pos.x, dogRig.position.z - h.pos.z) < h.r){ tip = h; break; }
      const hb = document.getElementById('hintBubble');
      if (tip && hb.dataset.tip !== tip.text){ hb.innerHTML = tip.text; hb.dataset.tip = tip.text; }
      hb.classList.toggle('show', !!tip); }
    for (const b of themeButtons){
      const target = b.id === theme ? 1.75 : 2.6;             // pressed / popped up
      b.cap.position.y += (target - b.cap.position.y) * Math.min(1, dt * 12);
      if (introDone && b.id && b.id !== theme &&
          Math.hypot(dogRig.position.x - b.world.x, dogRig.position.z - b.world.z) < 3.4) switchTheme(b.id);
    }
    if (theme === 'neon'){
      for (const [nm, src] of neonTracked) neonInto(src.color, nm.uniforms.color.value);   // dog glow follows its color
      composer.render();
    } else renderer.render(scene, camera);
  }
  animate();
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
