<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editors — Lorelai Blume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf3f7; --ink: #3a2b33; --muted: #9b8791; --accent: #d46a97; --line: #eadbe3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% -10%, #fdeaf2 0%, var(--bg) 55%);
      color: var(--ink); font-family: 'Karla', -apple-system, Segoe UI, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
    }
    .wrap { width: 100%; max-width: 460px; }
    header { text-align: center; margin-bottom: 34px; }
    header h1 {
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500;
      font-size: clamp(34px, 8vw, 52px); margin: 0; letter-spacing: .01em;
    }
    header p {
      margin: 8px 0 0; color: var(--muted); font-size: 13px;
      letter-spacing: .22em; text-transform: uppercase;
    }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a.item {
      display: flex; align-items: center; gap: 16px; padding: 18px 10px;
      text-decoration: none; color: var(--ink);
      transition: padding .22s ease, background .22s ease, color .22s ease;
    }
    a.item:hover { padding-left: 20px; background: rgba(212,106,151,.06); color: var(--accent); }
    a.item .emoji { font-size: 22px; width: 26px; text-align: center; flex: none; }
    a.item .name {
      font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 500; flex: 1;
    }
    a.item .arrow { color: var(--muted); font-size: 18px; transition: transform .22s ease, color .22s ease; }
    a.item:hover .arrow { transform: translateX(4px); color: var(--accent); }
    footer { text-align: center; margin-top: 30px; }
    footer a {
      color: var(--muted); text-decoration: none; font-size: 11px;
      letter-spacing: .2em; text-transform: uppercase; transition: color .2s ease;
    }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Editors</h1>
      <p>Tools for building lorelaiblume.com</p>
    </header>

    <ul>
      <li><a class="item" href="color-palette.html"><span class="emoji">🎨</span><span class="name">Color Palette</span><span class="arrow">→</span></a></li>
      <li><a class="item" href="dog.html"><span class="emoji">🎈</span><span class="name">Balloon Dog</span><span class="arrow">→</span></a></li>
      <li><a class="item" href="popcorn.html"><span class="emoji">🍿</span><span class="name">Popcorn Bucket</span><span class="arrow">→</span></a></li>
      <li><a class="item" href="unicorn.html"><span class="emoji">🦄</span><span class="name">Unicorn</span><span class="arrow">→</span></a></li>
      <li><a class="item" href="vehicle-glass.html"><span class="emoji">🚗</span><span class="name">Vehicle Glass</span><span class="arrow">→</span></a></li>
    </ul>

    <footer><a href="/">← Lorelai Blume</a></footer>
  </div>
</body>
</html>
