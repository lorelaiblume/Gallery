<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roam — Lorelai Blume</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f9e0ef;
                 font-family: -apple-system, Segoe UI, Karla, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
               font-size: 14px; color: #a24b7d; background: #f9e0ef;
               transition: opacity 0.35s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    .caption { position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
      z-index: 10; color: #a24b7d; font-size: 13px; letter-spacing: .03em; background: rgba(255,255,255,0.5);
      padding: 6px 14px; border-radius: 20px; }
    .home { position: fixed; left: 16px; bottom: 14px; z-index: 20;
      color: #b56a95; text-decoration: none; font-size: 0.72rem;
      letter-spacing: 0.18em; text-transform: uppercase; }
    canvas { touch-action: none; }
    #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      background: rgba(255,255,255,0.35); border: 2px solid rgba(162,75,125,0.35); z-index: 15;
      pointer-events: none; display: none; }
    #stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%; background: rgba(162,75,125,0.55); }
    #jumpBtn { position: fixed; right: 22px; bottom: 26px; z-index: 15; width: 72px; height: 72px;
      border-radius: 50%; border: 0; background: rgba(162,75,125,0.55); color: #fff;
      font: 700 13px/1 -apple-system, sans-serif; letter-spacing: .05em; display: none; }
    @media (pointer: coarse) { #jumpBtn { display: block; } }
    #stylePanel { position: fixed; right: 22px; top: 50%; width: 250px; z-index: 25; padding: 18px 18px 14px;
      transform: translate(calc(100% + 40px), -50%); transition: transform .45s cubic-bezier(.2,.9,.3,1.2);
      background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 22px; box-shadow: 0 10px 40px rgba(162,75,125,0.25); color: #a24b7d; }
    #stylePanel.open { transform: translate(0, -50%); }
    #stylePanel h2 { margin: 0 0 12px; font: 700 18px/1.1 Georgia, serif; text-align: center; letter-spacing: .02em; }
    #stylePanel .sec { margin-bottom: 14px; }
    #stylePanel .sec > span { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 7px; opacity: .8; }
    #stylePanel .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    #stylePanel .sw { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15); cursor: pointer; padding: 0; }
    #stylePanel .sw.on { outline: 3px solid #a24b7d; outline-offset: 1px; }
    #stylePanel .sw.custom { background: conic-gradient(#ff6fae, #f6b74a, #a9e05a, #56c5f1, #b58cff, #ff6fae); position: relative; overflow: hidden; }
    #stylePanel .sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    #stylePanel .opts { display: flex; flex-wrap: wrap; gap: 6px; }
    #stylePanel .opt { border: 0; border-radius: 999px; padding: 6px 11px; font: 600 12px/1 -apple-system, sans-serif;
      background: rgba(162,75,125,0.12); color: #a24b7d; cursor: pointer; }
    #stylePanel .opt.on { background: #a24b7d; color: #fff; }
    #styleDone { width: 100%; border: 0; border-radius: 999px; padding: 10px; margin-top: 4px; cursor: pointer;
      background: linear-gradient(90deg, #ff6fae, #b58cff); color: #fff; font: 700 14px/1 -apple-system, sans-serif; }
    #stylePanel .hint { margin: 7px 0 0; font-size: 11px; text-align: center; opacity: .65; }
    @media (max-width: 700px) {
      #stylePanel { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; transform: translateY(calc(100% + 30px)); }
      #stylePanel.open { transform: translateY(0); }
      #stylePanel .swatches { grid-template-columns: repeat(11, 1fr); }
    }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease; z-index: 50; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Waking up the dog…</div>
  <div class="caption" id="caption">WASD to walk · shift to run · drag to look around · space to jump · scroll to zoom · V: overview</div>
  <div id="stick"><i></i></div>
  <button id="jumpBtn">JUMP</button>
  <div id="stylePanel" aria-hidden="true">
    <h2>style your pup</h2>
    <div class="sec"><span>color</span><div class="swatches" id="swatches"></div></div>
    <div class="sec"><span>finish</span><div class="opts" id="finishOpts"></div></div>
    <div class="sec"><span>accessory</span><div class="opts" id="hatOpts"></div></div>
    <button id="styleDone">done ✓</button>
    <p class="hint">or just walk away</p>
  </div>
  <a class="home" href="/">← Lorelai Blume</a>
  <div id="flash"></div>

  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  } }
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  // ── loading: one shared manager, so the overlay lifts only once EVERY model is in ──
  const loadManager = new THREE.LoadingManager();
  let introClock = -1;                      // < 0: waiting for models; then seconds into the intro
  loadManager.onLoad = () => {
    introClock = 0;
    // wait one frame so the first render (with everything in place) happens under the overlay
    requestAnimationFrame(() => document.getElementById('loading').classList.add('done'));
  };
  loadManager.onError = (url) => console.error('Failed to load', url);
  function makeLoader(){
    const l = new GLTFLoader(loadManager);
    l.setMeshoptDecoder(MeshoptDecoder);   // rocket.glb is meshopt-compressed
    return l;
  }

  // ── renderer / scene ──
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('app').appendChild(renderer.domElement);

  const PINK = 0xf05080;      // the dish
  const SPACE = 0xf9e0ef;     // pale-pink empty space around it
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 3, 2200);
  camera.position.set(0, 8, 14);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xe7b9d6, 0.9));
  const sun = new THREE.DirectionalLight(0xfff4ea, 1.25);
  sun.position.set(30, 50, 20); sun.castShadow = true;
  sun.shadow.mapSize.set(4096,4096);
  sun.shadow.camera.near = 5; sun.shadow.camera.far = 600;
  sun.shadow.camera.left=-190; sun.shadow.camera.right=190; sun.shadow.camera.top=190; sun.shadow.camera.bottom=-190;
  sun.shadow.bias = -0.0004; scene.add(sun); scene.add(sun.target);
  const SUN_OFF = new THREE.Vector3(30, 50, 20).normalize().multiplyScalar(250);   // sun + shadow box follow the dog

  // ── the dish: a small finite pink disk floating in the pale-pink void ──
  const DISH_R = 150, DISH_TH = 12;
  const dish = new THREE.Group();
  const dishTop = new THREE.Mesh(
    new THREE.CircleGeometry(DISH_R, 96),
    new THREE.MeshBasicMaterial({ color: PINK }));
  dishTop.rotation.x = -Math.PI/2; dishTop.name = 'floor'; dish.add(dishTop);
  const dishSide = new THREE.Mesh(
    new THREE.CylinderGeometry(DISH_R, DISH_R, DISH_TH, 96, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xd23f6d, side: THREE.DoubleSide }));  // darker rim = depth
  dishSide.position.y = -DISH_TH/2; dishSide.name = 'rim'; dish.add(dishSide);
  const dishBottom = new THREE.Mesh(
    new THREE.CircleGeometry(DISH_R, 96),
    new THREE.MeshBasicMaterial({ color: 0xc23a64 }));
  dishBottom.rotation.x = Math.PI/2; dishBottom.position.y = -DISH_TH; dishBottom.name = 'under'; dish.add(dishBottom);
  scene.add(dish);

  // ================= atmosphere: sky, fog, sparkles =================
  const SKY_TOP = new THREE.Color(0xc9d3ff), SKY_HORIZON = new THREE.Color(SPACE), SKY_BELOW = new THREE.Color(0xf3c6de);
  scene.background = SKY_HORIZON.clone();
  scene.fog = new THREE.Fog(SKY_HORIZON, 200, 900);      // near/far re-tuned every frame from the camera distance
  {
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(1900, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: { top: { value: SKY_TOP }, horizon: { value: SKY_HORIZON }, below: { value: SKY_BELOW } },
        vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform vec3 top, horizon, below; varying vec3 vDir; void main(){
          float h = vDir.y;
          vec3 c = h > 0.0 ? mix(horizon, top, pow(smoothstep(0.0, 0.75, h), 0.8))
                           : mix(horizon, below, smoothstep(0.0, 0.6, -h));
          gl_FragColor = vec4(c, 1.0); }`
      }));
    sky.renderOrder = -1; sky.frustumCulled = false; sky.name = 'sky'; scene.add(sky);
    // keep the sky centred on the camera so you can never reach its edge
    sky.onBeforeRender = (r, sc, cam) => sky.position.copy(cam.position);
  }

  const sparkles = (() => {
    const N = 260, pos = new Float32Array(N*3), spd = new Float32Array(N);
    for (let i = 0; i < N; i++){
      const r = Math.sqrt(Math.random()) * DISH_R * 1.05, a = Math.random()*Math.PI*2;
      pos[i*3] = Math.cos(a)*r; pos[i*3+1] = Math.random()*70; pos[i*3+2] = Math.sin(a)*r;
      spd[i] = 1.5 + Math.random()*3;
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,230,245,0.8)'); gr.addColorStop(1, 'rgba(255,230,245,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.6, map: new THREE.CanvasTexture(c),
      transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
    scene.add(pts);
    return { pts, pos, spd, N };
  })();

  function updateAtmosphere(dt, t, camDistNow){
    const { pos, spd, N } = sparkles;
    for (let i = 0; i < N; i++){
      pos[i*3+1] += spd[i] * dt;
      pos[i*3]   += Math.sin(t*0.7 + i) * 0.6 * dt;
      if (pos[i*3+1] > 70) pos[i*3+1] = 0;
    }
    sparkles.pts.geometry.attributes.position.needsUpdate = true;
    // fog follows the zoom: gentle haze in the play view, still clear in the overview
    scene.fog.near = camDistNow * 0.9 + 140;
    scene.fog.far  = camDistNow * 1.3 + 950;
  }

  // soft contact shadow on the dish top
  const shadowCatcher = new THREE.Mesh(
    new THREE.CircleGeometry(DISH_R, 96),
    new THREE.ShadowMaterial({ opacity: 0.13 }));
  shadowCatcher.rotation.x = -Math.PI/2; shadowCatcher.position.y = 0.05;
  shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);

  // ── loop path around the edge of the dish (walk around to visit what we place) ──
  const PATH_R = DISH_R - 24, PATH_W = 28;
  (function buildLoopPath(){
    const COLORS = [0x6a86ef, 0x56c5f1, 0xa9e05a, 0xf6b74a, 0xf0794c, 0xef5566]; // periwinkle→red
    const inner = PATH_R - PATH_W/2, band = PATH_W / COLORS.length;
    COLORS.forEach((hex, i) => {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(inner + band*i, inner + band*(i+1), 160),
        new THREE.MeshBasicMaterial({ color: hex, toneMapped: false }));
      ring.rotation.x = -Math.PI/2;
      ring.position.y = 0.12;
      scene.add(ring);
    });
  })();

  // ── marker halos (placeholders for what we'll add later) ──
  // 5 evenly spaced on the rim + 1 in the center. They gently pulse/glow.
  const halos = [];
  const HALO_R = DISH_R * 0.055;   // scales with the dish
  (function buildHalos(){
    function makeHalo(x, z){
      const g = new THREE.Group();
      g.position.set(x, 0.25, z);
      const core = new THREE.Mesh(
        new THREE.RingGeometry(HALO_R*0.62, HALO_R, 64),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9,
          blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
      core.rotation.x = -Math.PI/2; g.add(core);
      const glow = new THREE.Mesh(
        new THREE.RingGeometry(HALO_R, HALO_R*1.85, 64),
        new THREE.MeshBasicMaterial({ color: 0xffd9f2, transparent: true, opacity: 0.32,
          blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
      glow.rotation.x = -Math.PI/2; g.add(glow);
      scene.add(g);
      halos.push({ grp: g, core, glow, phase: Math.random()*Math.PI*2 });
    }
    makeHalo(0, 0);                                  // center
    for (let i = 0; i < 5; i++){                     // evenly spaced on the loop path
      const a = (i/5)*Math.PI*2 - Math.PI/2;         // first one at the top
      makeHalo(Math.cos(a)*PATH_R, Math.sin(a)*PATH_R);
    }
  })();

  // ── rainbow spoke paths: flat, same width as the loop, from center out to each rim halo ──
  //    inner ends fan onto a circular arc so they wrap cleanly around the center halo,
  //    and the inner clearing is wide enough that the five spokes never overlap each other.
  (function buildSpokes(){
    const COLORS = [0x6a86ef, 0x56c5f1, 0xa9e05a, 0xf6b74a, 0xf0794c, 0xef5566]; // periwinkle→red
    const W = PATH_W;                     // match the loop path width
    const INNER = HALO_R * 3.3;           // rounded clearing radius around the center halo
    const rOuter = PATH_R - HALO_R * 1.9; // stop just short of the rim halo
    const y = 0.12, SUBU = 4;             // sub-samples per colour band → smooth inner arc
    function spoke(a){
      const d = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
      const perp = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), d).normalize();
      // inner cap rides the center circle (radius INNER) but keeps the side edges parallel,
      // so the spoke is a straight constant-width road — no bowtie/hourglass.
      const innerPt = o => d.clone().multiplyScalar(Math.sqrt(Math.max(0, INNER*INNER - o*o)))
                            .addScaledVector(perp, o);
      const outerPt = o => d.clone().multiplyScalar(rOuter).addScaledVector(perp, o);
      const laneW = W / COLORS.length, pos = [], col = [], tmp = new THREE.Color();
      for (let k=0;k<COLORS.length;k++){
        tmp.setHex(COLORS[k]);
        for (let s=0;s<SUBU;s++){
          const o0 = -W/2 + (k + s/SUBU)*laneW, o1 = -W/2 + (k + (s+1)/SUBU)*laneW;
          const i0 = innerPt(o0), i1 = innerPt(o1), q0 = outerPt(o0), q1 = outerPt(o1);
          pos.push(i0.x,y,i0.z, i1.x,y,i1.z, q1.x,y,q1.z, i0.x,y,i0.z, q1.x,y,q1.z, q0.x,y,q0.z);
          for (let n=0;n<6;n++) col.push(tmp.r,tmp.g,tmp.b);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
      g.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(col),3));
      const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
        vertexColors:true, toneMapped:false, side:THREE.DoubleSide }));
      scene.add(mesh);
    }
    // spokes removed on the big dish (only the outer loop stays); kept the builder in case we want one back
    // for (let i = 0; i < 5; i++){ const a = (i/5)*Math.PI*2 - Math.PI/2; spoke(a); }
  })();

  // ================= portal island: rocket, popcorn + palette, reached by a rainbow bridge =================
  const BRIDGE_A = (2/5)*Math.PI*2 - Math.PI/2;             // the bridge continues spoke #2 off the big dish
  const BRIDGE_DIR = new THREE.Vector3(Math.cos(BRIDGE_A), 0, Math.sin(BRIDGE_A));
  const ISLE_R = 110, GAP = 110, ISLE_PATH_R = 62;
  const ISLE_C = BRIDGE_DIR.clone().multiplyScalar(DISH_R + GAP + ISLE_R);
  const HEADING0 = Math.atan2(BRIDGE_DIR.x, BRIDGE_DIR.z);   // the dog spawns facing the bridge
  // the three portals sit in a semicircle on the island's loop, across from the bridge.
  // angle 0 = straight across; negative = left, positive = right (as you walk off the bridge)
  const ARC = 1.55;                                          // ~89° between neighbours (popcorn + rocket out to the sides)
  const SPOT_R = 72;                                         // a bit further out than the loop's centre line
  const SPOT = { popcorn: -ARC, palette: 0, rocket: ARC };
  function isleSpot(phi){
    const a = BRIDGE_A + phi;
    return new THREE.Vector3(ISLE_C.x + Math.cos(a)*SPOT_R, 0, ISLE_C.z + Math.sin(a)*SPOT_R);
  }
  // where the bridge meets the island's loop — everything turns to face this spot
  const ISLE_ENTRY = ISLE_C.clone().addScaledVector(BRIDGE_DIR, -(ISLE_PATH_R + PATH_W/2));
  const yawToward = (from, to) => Math.atan2(to.x - from.x, to.z - from.z);   // rotation.y that points local +z at `to`
  const RAINBOW = [0x6a86ef, 0x56c5f1, 0xa9e05a, 0xf6b74a, 0xf0794c, 0xef5566]; // periwinkle→red

  const isleTop = (function buildIsland(){
    const g = new THREE.Group(); g.position.copy(ISLE_C);
    const top = new THREE.Mesh(new THREE.CircleGeometry(ISLE_R, 96), new THREE.MeshBasicMaterial({ color: PINK }));
    top.rotation.x = -Math.PI/2; top.name = 'floor'; g.add(top);
    const side = new THREE.Mesh(new THREE.CylinderGeometry(ISLE_R, ISLE_R, DISH_TH, 96, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xd23f6d, side: THREE.DoubleSide }));
    side.position.y = -DISH_TH/2; side.name = 'rim'; g.add(side);
    const bottom = new THREE.Mesh(new THREE.CircleGeometry(ISLE_R, 96), new THREE.MeshBasicMaterial({ color: 0xc23a64 }));
    bottom.rotation.x = Math.PI/2; bottom.position.y = -DISH_TH; bottom.name = 'under'; g.add(bottom);
    const catcher = new THREE.Mesh(new THREE.CircleGeometry(ISLE_R, 96), new THREE.ShadowMaterial({ opacity: 0.13 }));
    catcher.rotation.x = -Math.PI/2; catcher.position.y = 0.05; catcher.receiveShadow = true; g.add(catcher);
    const inner = ISLE_PATH_R - PATH_W/2, band = PATH_W / RAINBOW.length;
    RAINBOW.forEach((hex, i) => {
      const ring = new THREE.Mesh(new THREE.RingGeometry(inner + band*i, inner + band*(i+1), 128),
        new THREE.MeshBasicMaterial({ color: hex, toneMapped: false }));
      ring.rotation.x = -Math.PI/2; ring.position.y = 0.12; g.add(ring);
    });
    scene.add(g);
    return top;
  })();

  // rainbow bridge: flat across the big dish's rim, a gentle arch over the gap, flat again onto the island's loop
  const bridgeTop = (function buildBridge(){
    const W = PATH_W, LANES = RAINBOW.length, laneW = W / LANES, N = 120, KEEL = 2.5, ARCH = 12;
    const s0 = PATH_R + PATH_W/2;                            // start: outer edge of the big dish's loop
    const s1 = DISH_R, s2 = DISH_R + GAP;                    // the gap between the dishes
    const s3 = DISH_R + GAP + ISLE_R - (ISLE_PATH_R + PATH_W/2);   // end: outer edge of the island's loop
    const perp = new THREE.Vector3(-BRIDGE_DIR.z, 0, BRIDGE_DIR.x);
    const yAt = sAlong => {
      const base = 0.14;
      if (sAlong <= s1 || sAlong >= s2) return base;
      const u = (sAlong - s1) / (s2 - s1);
      return base + ARCH * (1 - Math.cos(u*Math.PI*2)) / 2;
    };
    const pt = (sAlong, o, dy = 0) => new THREE.Vector3(
      BRIDGE_DIR.x*sAlong + perp.x*o, yAt(sAlong) + dy, BRIDGE_DIR.z*sAlong + perp.z*o);
    const topPos = [], topCol = [], keelPos = [], c = new THREE.Color();
    const pushQuad = (arr, a, b, q, d) => arr.push(a.x,a.y,a.z, b.x,b.y,b.z, q.x,q.y,q.z, a.x,a.y,a.z, q.x,q.y,q.z, d.x,d.y,d.z);
    for (let i = 0; i < N; i++){
      const sa = s0 + (s3 - s0)*i/N, sb = s0 + (s3 - s0)*(i+1)/N;
      for (let k = 0; k < LANES; k++){
        const o0 = -W/2 + k*laneW, o1 = o0 + laneW;
        pushQuad(topPos, pt(sa,o0), pt(sa,o1), pt(sb,o1), pt(sb,o0));
        c.setHex(RAINBOW[k]); for (let n = 0; n < 6; n++) topCol.push(c.r, c.g, c.b);
      }
      // underside + side walls so the arch has some thickness
      pushQuad(keelPos, pt(sa,-W/2,-KEEL), pt(sa,W/2,-KEEL), pt(sb,W/2,-KEEL), pt(sb,-W/2,-KEEL));
      pushQuad(keelPos, pt(sa,-W/2), pt(sa,-W/2,-KEEL), pt(sb,-W/2,-KEEL), pt(sb,-W/2));
      pushQuad(keelPos, pt(sa, W/2), pt(sa, W/2,-KEEL), pt(sb, W/2,-KEEL), pt(sb, W/2));
    }

  // ---- Loop subdivision (one pass, for a smoother dog) ----
  function weldGeo(geo){
    const p = geo.getAttribute('position').array;
    const index = geo.index ? geo.index.array : null;
    const map = new Map(), wpos = [], wid = new Int32Array(p.length/3), q = 1e4;
    for (let i=0;i<p.length/3;i++){
      const k = Math.round(p[i*3]*q)+"_"+Math.round(p[i*3+1]*q)+"_"+Math.round(p[i*3+2]*q);
      let id = map.get(k);
      if (id===undefined){ id = wpos.length/3; map.set(k,id); wpos.push(p[i*3],p[i*3+1],p[i*3+2]); }
      wid[i] = id;
    }
    let idx;
    if (index){ idx = new Uint32Array(index.length); for (let i=0;i<index.length;i++) idx[i]=wid[index[i]]; }
    else { idx = new Uint32Array(p.length/3); for (let i=0;i<idx.length;i++) idx[i]=wid[i]; }
    return { pos:new Float32Array(wpos), idx };
  }
  function loopSubdivide({pos,idx}){
    const NV=pos.length/3, NF=idx.length/3, ekey=(a,b)=>(a<b?a:b)*NV+(a<b?b:a);
    const edges=new Map(), neigh=Array.from({length:NV},()=>new Set());
    for(let f=0;f<NF;f++){const a=idx[f*3],b=idx[f*3+1],c=idx[f*3+2];
      for(const [u,v,w] of [[a,b,c],[b,c,a],[c,a,b]]){ const k=ekey(u,v); let e=edges.get(k);
        if(!e){e={a:u<v?u:v,b:u<v?v:u,opp:[],cnt:0};edges.set(k,e);} e.opp.push(w); e.cnt++; neigh[u].add(v); neigh[v].add(u); } }
    const ep=new Map(), np=Array.from(pos); let next=NV;
    for(const [k,e] of edges){ const a=e.a,b=e.b; let x,y,z;
      if(e.cnt===2){const c=e.opp[0],d=e.opp[1];
        x=3/8*(pos[a*3]+pos[b*3])+1/8*(pos[c*3]+pos[d*3]); y=3/8*(pos[a*3+1]+pos[b*3+1])+1/8*(pos[c*3+1]+pos[d*3+1]); z=3/8*(pos[a*3+2]+pos[b*3+2])+1/8*(pos[c*3+2]+pos[d*3+2]);
      } else { x=(pos[a*3]+pos[b*3])/2; y=(pos[a*3+1]+pos[b*3+1])/2; z=(pos[a*3+2]+pos[b*3+2])/2; }
      ep.set(k,next); np.push(x,y,z); next++; }
    const bound=new Uint8Array(NV); for(const [,e] of edges) if(e.cnt===1){bound[e.a]=1;bound[e.b]=1;}
    for(let v=0;v<NV;v++){ const nb=[...neigh[v]],n=nb.length; if(bound[v]||n===0) continue;
      const beta=(1/n)*(5/8-Math.pow(3/8+1/4*Math.cos(2*Math.PI/n),2)); let sx=0,sy=0,sz=0;
      for(const u of nb){sx+=pos[u*3];sy+=pos[u*3+1];sz+=pos[u*3+2];}
      np[v*3]=(1-n*beta)*pos[v*3]+beta*sx; np[v*3+1]=(1-n*beta)*pos[v*3+1]+beta*sy; np[v*3+2]=(1-n*beta)*pos[v*3+2]+beta*sz; }
    const ni=[]; for(let f=0;f<NF;f++){const a=idx[f*3],b=idx[f*3+1],c=idx[f*3+2];
      const ab=ep.get(ekey(a,b)),bc=ep.get(ekey(b,c)),ca=ep.get(ekey(c,a)); ni.push(a,ab,ca, ab,b,bc, ca,bc,c, ab,bc,ca); }
    return { pos:new Float32Array(np), idx:new Uint32Array(ni) };
  }

  function computeLegData(){
    const p=dogMesh.geometry.getAttribute('position').array, N=p.length/3;
    restPos=Float32Array.from(p);
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,mnz=1e9,mxz=-1e9;
    for(let i=0;i<N;i++){const x=p[i*3],y=p[i*3+1],z=p[i*3+2]; if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;if(z<mnz)mnz=z;if(z>mxz)mxz=z;}
    const midX=(mnx+mxx)/2, midZ=(mnz+mxz)/2, thr=mny+(mxy-mny)*0.42;

  // ================= dog styling (balloon cart) =================

  function accMat(c, o = {}){ return new THREE.MeshPhysicalMaterial(Object.assign({ color: c, roughness: 0.3, clearcoat: 0.8 }, o)); }
  function makeAccessory(kind){
    const g = new THREE.Group();
    const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };

    if (savedCam){ camPitchT = savedCam.pitch; camDistT = savedCam.dist; }
    yawOffset = 0;
    panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
    document.getElementById('caption').style.opacity = '';
  }
  addEventListener('keydown', e => {
    if (styleMode && ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.code)) exitStyle();
  });

  // ================= themes: classic (starter) + neon =================
  // Every mesh keeps its classic material in userData.classicMat; a theme swaps in its own version.
  let theme = 'classic', themeSwitching = false;
  const CLASSIC_SKY = { top: SKY_TOP.getHex(), horizon: SKY_HORIZON.getHex(), below: SKY_BELOW.getHex(), fog: scene.fog.color.getHex(), bg: scene.background.getHex() };
  const NEON_SKY = { top: 0x0b0226, horizon: 0x06010f, below: 0x000000, fog: 0x05010c, bg: 0x000000 };

  // bloom for the neon look (only used while neon is on)
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.4, 0.8);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const _hsl = {};
  // map any color to the nearest bright "neon" color
  // the rainbow paths get a real neon rainbow, lane for lane (periwinkle→purple … red→red)
  const NEON_RAINBOW = { 0x6a86ef: 0xb026ff, 0x56c5f1: 0x2d6bff, 0xa9e05a: 0x39ff14,
                         0xf6b74a: 0xfff200, 0xf0794c: 0xff8a00, 0xef5566: 0xff1a3c };
  function neonInto(src, out, remap){
    const rb = NEON_RAINBOW[src.getHex()];
    if (rb !== undefined) return out.set(rb);
    neonBase(src, out);
    if (remap){ const r = remap[out.getHex()]; if (r !== undefined) out.set(r); }
    return out;
  }
  function neonBase(src, out){
    src.getHSL(_hsl);
    if (_hsl.l < 0.12) return out.set(0x14002a);                                  // near-black stays dark (deep violet)
    if (_hsl.s >= 0.15 && _hsl.s < 0.45 && _hsl.l < 0.4) return out.set(0xb026ff); // browns / muddy darks → neon purple
    if (_hsl.s < 0.15) return out.set(_hsl.l > 0.6 ? 0xffffff : _hsl.l > 0.3 ? 0xd9d9ff : 0x3a2a5a);  // white / silver / dark grey
    const h = _hsl.h * 360;
    if (h < 12 || h >= 348) return out.set(0xff1a3c);    // red → neon red
    if (h < 20 || h >= 290) return out.set(0xff2bd6);    // magenta, pink → hot pink
    if (h < 40)  return out.set(0xff8a00);               // electric orange
    if (h < 70)  return out.set(0xfff200);               // electric yellow
    if (h < 165) return out.set(0x39ff14);               // lime
    if (h < 200) return out.set(0x00f0ff);               // cyan
    if (h < 250) return out.set(0x2d6bff);               // electric blue
    return out.set(0xb026ff);                            // neon purple
  }
  const neonOf = c => neonInto(c, new THREE.Color());
  // recolor a texture (cart stripes, signs) pixel by pixel through the same neon mapping
  function neonTex(tex, remap){
    const img = tex.image; if (!img || !img.width) return tex;
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), px = d.data, memo = new Map();
    const col = new THREE.Color(), out = new THREE.Color(), rgb = {};
    for (let i = 0; i < px.length; i += 4){
      const key = (px[i] << 16) | (px[i+1] << 8) | px[i+2];
      let v = memo.get(key);
      if (v === undefined){
        col.setRGB(px[i]/255, px[i+1]/255, px[i+2]/255, THREE.SRGBColorSpace);
        neonInto(col, out, remap).getRGB(rgb, THREE.SRGBColorSpace);
        v = [rgb.r*255, rgb.g*255, rgb.b*255]; memo.set(key, v);
      }
      px[i] = v[0]; px[i+1] = v[1]; px[i+2] = v[2];
    }
    x.putImageData(d, 0, 0);
    const t = new THREE.CanvasTexture(c); t.colorSpace = tex.colorSpace; t.wrapS = tex.wrapS; t.wrapT = tex.wrapT;
    return t;
  }
  // the dog keeps the glowing-outline look: dark body + bright fresnel rim
  function fresnelMat(src){
    return new THREE.ShaderMaterial({
      uniforms: { color: { value: neonOf(src.color || new THREE.Color(1,1,1)) }, map: { value: src.map || null },
                  useMap: { value: src.map ? 1 : 0 }, opacity: { value: src.opacity ?? 1 } },
      side: src.side, transparent: !!src.transparent,
      vertexShader: `varying vec3 vN; varying vec3 vV; varying vec2 vUv;
        void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform vec3 color; uniform sampler2D map; uniform float useMap; uniform float opacity;
        varying vec3 vN; varying vec3 vV; varying vec2 vUv;
        void main(){
          vec3 n = normalize(vN) * (gl_FrontFacing ? 1.0 : -1.0);
          float f = 1.0 - clamp(dot(n, normalize(vV)), 0.0, 1.0);
          vec3 c = color;
          if (useMap > 0.5){ vec3 t = texture2D(map, vUv).rgb; c = t / max(max(t.r, t.g), max(t.b, 0.05)); }
          gl_FragColor = vec4(c * (0.07 + 0.3*f + 2.6*pow(f, 3.0)), opacity);
        }`
    });
  }
  // dish floors: black with a glowing grid and a bright rim
  function gridMat(cx, cz, R){
    return new THREE.ShaderMaterial({
      uniforms: { c: { value: new THREE.Vector2(cx, cz) }, R: { value: R },
                  line: { value: new THREE.Color(0xff2bd6) }, edge: { value: new THREE.Color(0x00e5ff) } },
      side: THREE.DoubleSide,
      vertexShader: `varying vec3 wp; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); wp = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w; }`,
      fragmentShader: `uniform vec2 c; uniform float R; uniform vec3 line, edge; varying vec3 wp;
        void main(){
          vec2 q = (wp.xz - c) / 12.0;
          vec2 g = abs(fract(q - 0.5) - 0.5) / fwidth(q);
          float l = 1.0 - min(min(g.x, g.y), 1.0);
          float r = length(wp.xz - c);
          float e = smoothstep(R - 6.0, R - 0.5, r);
          vec3 col = vec3(0.012, 0.0, 0.03) + line * l * 0.32 + edge * e * 1.2;
          gl_FragColor = vec4(col, 1.0);
        }`
    });
  }
  const neonTracked = [];                 // neon materials that follow a live classic material (the dog)
  function remapOf(o){ for (let p = o; p; p = p.parent) if (p.userData.neonRemap) return p.userData.neonRemap; return null; }
  function neonMaterial(o, m){
    const remap = remapOf(o);
    if (o.name === 'floor') return o === isleTop ? gridMat(ISLE_C.x, ISLE_C.z, ISLE_R) : gridMat(0, 0, DISH_R);
    if (o.name === 'rim')   return new THREE.MeshBasicMaterial({ color: 0x2d6bff, side: THREE.DoubleSide, toneMapped: false });
    if (o.name === 'under') return new THREE.MeshBasicMaterial({ color: 0x000000 });
    if (m.isShadowMaterial) return m;                    // keep the soft shadows
    if (m === dogMat){ const f = fresnelMat(m); neonTracked.push([f, m]); return f; }   // glowing neon dog
    const n = m.clone();
    if (m.map) n.map = neonTex(m.map, remap);
    if (m.isMeshBasicMaterial || m.isLineBasicMaterial || m.isPointsMaterial){
      if (!m.map && !m.vertexColors) neonInto(m.color, n.color, remap);   // (vertex colors are swapped on the geometry)
      return n;
    }
    // lit materials: solid neon color + a little self-glow so it pops on the dark
    neonInto(m.color, n.color, remap);
    if (m.emissive && m.emissiveIntensity > 1 && m.emissive.getHex() !== 0){   // things that already glow (palette paint)
      n.emissive = neonOf(m.emissive); n.emissiveIntensity = 2.2;
    } else if (n.emissive){
      if (n.map){ n.emissiveMap = n.map; n.emissive.setScalar(0.3); }
      else n.emissive.copy(n.color).multiplyScalar(0.3);
      n.emissiveIntensity = 1;
    }
    return n;
  }
  const neonCache = new Map();           // one neon material per classic material (the popcorn has ~1000 kernels sharing one)
  function neonFor(o, m){
    if (o.name === 'floor' || o.name === 'rim' || o.name === 'under') return neonMaterial(o, m);
    const key = m.uuid + '|' + (remapOf(o) ? remapOf(o).id : '');
    if (!neonCache.has(key)) neonCache.set(key, neonMaterial(o, m));
    return neonCache.get(key);
  }
  function applyThemeTo(root, id){
    root.traverse(o => {
      if (!(o.isMesh || o.isPoints || o.isLine) || o.name === 'sky') return;
      if (o.userData.classicMat === undefined) o.userData.classicMat = o.material;
      const vc = o.geometry && o.geometry.attributes.color;
      if (vc && !Array.isArray(o.userData.classicMat) && o.userData.classicMat.vertexColors){
        if (!o.userData.classicColor){
          o.userData.classicColor = vc;
          const nv = vc.clone(), c = new THREE.Color();
          for (let i = 0; i < nv.count; i++){ c.fromBufferAttribute(vc, i); neonInto(c, c); nv.setXYZ(i, c.r, c.g, c.b); }
          o.userData.neonColor = nv;
        }
        o.geometry.setAttribute('color', id === 'classic' ? o.userData.classicColor : o.userData.neonColor);
      }
      if (id === 'classic'){ o.material = o.userData.classicMat; return; }
      const orig = o.userData.classicMat;
      if (!o.userData.neonMat) o.userData.neonMat = Array.isArray(orig) ? orig.map(m => neonFor(o, m)) : neonFor(o, orig);
      o.material = o.userData.neonMat;
    });
  }
  function applyTheme(id){
    theme = id;
    applyThemeTo(scene, id);
    const k = id === 'neon' ? NEON_SKY : CLASSIC_SKY;
    SKY_TOP.set(k.top); SKY_HORIZON.set(k.horizon); SKY_BELOW.set(k.below);
    scene.fog.color.set(k.fog); scene.background.set(k.bg);
  }
  function switchTheme(id){
    if (themeSwitching || id === theme) return;
    themeSwitching = true;
    const f = document.getElementById('flash');
    f.style.transition = 'opacity .22s ease'; f.style.background = id === 'neon' ? '#000' : '#fff'; f.style.opacity = '1';
    setTimeout(() => {
      applyTheme(id);
      f.style.opacity = '0';
      setTimeout(() => { f.style.transition = ''; f.style.background = ''; themeSwitching = false; }, 320);
    }, 240);
  }

  // ---------- theme station: three arcade buttons on a platform, to your left at spawn ----------
  const themeButtons = [];
  (function buildThemeStation(){
    const g = new THREE.Group();
    const left = new THREE.Vector3(BRIDGE_DIR.z, 0, -BRIDGE_DIR.x);
    g.position.copy(left).multiplyScalar(62);
    g.rotation.y = yawToward(g.position, new THREE.Vector3(0, 0, 0));
    const phys = (color, o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({ color, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.15 }, o));
    const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; g.add(m); return m; };
    function label(text, w, h, font){
      const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512*h/w);
      const x = c.getContext('2d'); x.fillStyle = '#fff6f1'; x.fillRect(0, 0, c.width, c.height);
      x.fillStyle = '#7a2a55'; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(text, c.width/2, c.height/2);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
      return new THREE.MeshBasicMaterial({ map: t });
    }
    const white = phys(0xfff6f1), dark = phys(0x2b2230, { metalness: 0.3, roughness: 0.4 });
    add(new THREE.BoxGeometry(38, 0.8, 15), white, 0, 0.4, 0);                              // platform
    add(new THREE.BoxGeometry(38.6, 0.3, 15.6), phys(0xf3c14b, { metalness: 0.6 }), 0, 0.15, 0);
    for (const x of [-12, 12]) add(new THREE.CylinderGeometry(0.35, 0.35, 8, 12), white, x, 4.4, -6.3);
    add(new THREE.BoxGeometry(27, 5, 0.6), white, 0, 8, -6.3);                              // sign
    add(new THREE.PlaneGeometry(25, 4), label('✦ themes ✦', 25, 4, '600 64px Georgia, serif'), 0, 8, -5.98).castShadow = false;
    const DEFS = [
      { id: 'classic', color: 0xff6fae, text: 'classic' },
      { id: 'neon',    color: 0x8a2be2, text: 'neon', emissive: 0x5a1aff },
      { id: null,      color: 0xbdb6c4, text: 'coming soon' },
    ];
    DEFS.forEach((d, i) => {
      const x = (i - 1) * 12;
      add(new THREE.CylinderGeometry(4.3, 4.6, 1.4, 48), dark, x, 1.5, 0);                  // housing
      const cap = add(new THREE.CylinderGeometry(3.6, 3.6, 1.6, 48),
        phys(d.color, d.emissive ? { emissive: d.emissive, emissiveIntensity: 0.6 } : {}), x, d.id === 'classic' ? 1.75 : 2.6, 0);
      const lab = add(new THREE.PlaneGeometry(8, 1.9), label(d.text, 8, 1.9, '600 60px Georgia, serif'), x, 0.82, 5.6);
      lab.rotation.x = -Math.PI/2; lab.castShadow = false;
      themeButtons.push({ id: d.id, cap, x });
    });
    scene.add(g);
    g.updateMatrixWorld(true);
    for (const b of themeButtons) b.world = g.localToWorld(new THREE.Vector3(b.x, 0, 0));
  })();
  const themeCaps = themeButtons.map(b => b.cap);

  const clock = new THREE.Clock();
  let elapsed = 0;

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    elapsed += dt;

    // pulse the marker halos
    for (const h of halos){
      if (h === centerHalo && !introDone) continue;
      const p = 0.5 + 0.5*Math.sin(elapsed*2 + h.phase);
      h.core.material.opacity = 0.55 + 0.4*p;
      h.glow.material.opacity = 0.18 + 0.28*p;
      const s = 1 + 0.07*p; h.grp.scale.set(s, 1, s);
    }

    runIntro(dt);
    // input: W/S walk along the dog's heading, A/D turn it (the camera follows behind)
    if (styleMode && (Math.abs(stick.x) > 0.35 || Math.abs(stick.y) > 0.35)) exitStyle();
    const canMove = introDone && !styleMode;
    let fIn = canMove ? stick.y : 0, tIn = canMove ? -stick.x : 0;
    if (canMove){
      if (keys.KeyW || keys.ArrowUp)    fIn += 1;
      if (keys.KeyS || keys.ArrowDown)  fIn -= 1;
      if (keys.KeyA || keys.ArrowLeft)  tIn += 1;
      if (keys.KeyD || keys.ArrowRight) tIn -= 1;
    }
    fIn = THREE.MathUtils.clamp(fIn, -1, 1); tIn = THREE.MathUtils.clamp(tIn, -1, 1);
    const move = Math.abs(fIn) > 0.08 ? fIn : 0;
    const turning = Math.abs(tIn) > 0.08;
    if (turning) heading += tIn * TURN * dt;
    const prevX = dogRig.position.x, prevZ = dogRig.position.z;
    const running = canMove && (keys.ShiftLeft || keys.ShiftRight);   // hold shift to run
    const speed = MOVE * (running ? RUN : 1);
    if (move){
      dogRig.position.x += Math.sin(heading) * speed * move * dt;
      dogRig.position.z += Math.cos(heading) * speed * move * dt;
    }
    // once you walk or turn (and aren't dragging), the camera eases back behind the dog
    if ((move || turning) && dragId === null) yawOffset *= Math.exp(-dt * 3);
    if (styleMode){
      // glide onto the pad and turn to face out, cart behind you
      let d = STYLE_FACING - heading; d = Math.atan2(Math.sin(d), Math.cos(d));
      heading += d * Math.min(1, dt * 6);
      dogRig.position.x += (STYLE_PAD.x - dogRig.position.x) * Math.min(1, dt * 6);
      dogRig.position.z += (STYLE_PAD.z - dogRig.position.z) * Math.min(1, dt * 6);
    } else if (introDone && dogMesh){
      const pd = Math.hypot(dogRig.position.x - STYLE_PAD.x, dogRig.position.z - STYLE_PAD.z);
      if (styleArmed && pd < 5) enterStyle();
      else if (pd > 6.5) styleArmed = true;          // stepped off the pad → it works again next time
    }
    dogRig.rotation.y = heading;

    if (dogMesh){
      walking = (move !== 0 || turning) && !airborne;
      if (walking){ walkT += dt * 13 * Math.max(0.6, Math.abs(move)) * (running && move ? 1.6 : 1); deformWalk(); }
      else if (restPos){ restoreRest(); }

      // climb physics: follow the surface under the dog (dish floor, or up onto the palette)
      const walk = paletteObj ? [dishTop, isleTop, bridgeTop, paletteObj, ...themeCaps] : [dishTop, isleTop, bridgeTop, ...themeCaps];
      downRay.set(_downOrigin.set(dogRig.position.x, 300, dogRig.position.z), _down);
      let hit = downRay.intersectObjects(walk, true)[0];
      if (!hit){
        // nothing to stand on here (edge of a dish or the bridge) → don't take that step
        dogRig.position.x = prevX; dogRig.position.z = prevZ;
        downRay.set(_downOrigin.set(prevX, 300, prevZ), _down);
        hit = downRay.intersectObjects(walk, true)[0];
      }
      if (hit) groundY = hit.point.y; else if (!airborne) groundY = dogRig.position.y;
      if (!introDone) wantJump = false;
      if (wantJump && !airborne){ airborne = true; vy = JUMP_V; }
      wantJump = false;
      if (airborne){
        dogRig.position.y += vy * dt; vy -= GRAVITY * dt;
        const floor = hit ? hit.point.y : groundY;
        if (vy < 0 && dogRig.position.y <= floor){ dogRig.position.y = floor; airborne = false; vy = 0; }
      } else if (hit) dogRig.position.y += (hit.point.y - dogRig.position.y) * Math.min(1, dt*10);
    }

    // popcorn portal: door stays shut until you're close, then swings open fast;
    // walk into the white light to get transported.
    if (popcornDoor){
      const dx = dogRig.position.x - popcornEntry.x, dz = dogRig.position.z - popcornEntry.z;
      const dist = Math.hypot(dx, dz);
      const OPEN = 48, TOUCH = 13;
      const wantOpen = dist < OPEN ? 1 : 0;
      popcornDoor.rotation.y = THREE.MathUtils.lerp(popcornDoor.rotation.y, -wantOpen * Math.PI * 0.62, 0.3);
      if (popcornGlow){
        popcornGlow.material.opacity = THREE.MathUtils.lerp(popcornGlow.material.opacity, wantOpen*0.95, 0.3);
        const halo = popcornGlow.userData.halo;
        if (halo) halo.material.opacity = THREE.MathUtils.lerp(halo.material.opacity, wantOpen*0.5, 0.3);
      }
      if (!portalTriggered && dist < TOUCH){ portalTriggered = true; enterPortal(); }
    }

    // palette portal: pulse the glowing blue paint; step on it to enter the gallery
    if (paletteGlow){
      const p = 0.5 + 0.5*Math.sin(elapsed*2.5);
      paletteGlow.emissiveIntensity = 2.4 + 2.6*p;   // pulsing neon, cranked
      if (!galleryTriggered && dogMesh){
        const dx = dogRig.position.x - palettePortal.x, dz = dogRig.position.z - palettePortal.z;
        if (dx*dx + dz*dz < 13*13){ galleryTriggered = true; enterGallery(); }
      }
    }

    // follow camera: sits behind the dog (heading + π) plus any drag look-around
    if (introDone){
      const want = heading + (styleMode ? 0 : Math.PI) + yawOffset;
      let d = want - camYaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      camYaw += d * (1 - Math.exp(-dt * 8));
    }
    const ease = 1 - Math.exp(-dt * 4);
    camDist  += (camDistT  - camDist)  * ease;
    camPitch += (camPitchT - camPitch) * ease;
    styleShift += ((styleMode && innerWidth > 700 ? 4.5 : 0) - styleShift) * ease;
    _dir.set(dogRig.position.x + Math.cos(camYaw)*styleShift, dogRig.position.y + 4, dogRig.position.z - Math.sin(camYaw)*styleShift);
    camTarget.lerp(_dir, 1 - Math.exp(-dt * 10));
    const hz = Math.cos(camPitch) * camDist;
    camera.position.set(camTarget.x + Math.sin(camYaw)*hz, camTarget.y + Math.sin(camPitch)*camDist, camTarget.z + Math.cos(camYaw)*hz);
    camera.lookAt(camTarget);
    sun.target.position.copy(dogRig.position); sun.position.copy(dogRig.position).add(SUN_OFF);
    updateAtmosphere(dt, elapsed, camDist);
    for (const u of stationUpdaters) u(dt, elapsed);

    for (const b of themeButtons){
      const target = b.id === theme ? 1.75 : 2.6;             // pressed / popped up
      b.cap.position.y += (target - b.cap.position.y) * Math.min(1, dt * 12);
      if (introDone && b.id && b.id !== theme &&
          Math.hypot(dogRig.position.x - b.world.x, dogRig.position.z - b.world.z) < 3.4) switchTheme(b.id);
    }
    if (theme === 'neon'){
      for (const [nm, src] of neonTracked) neonInto(src.color, nm.uniforms.color.value);   // dog glow follows its color
      composer.render();
    } else renderer.render(scene, camera);
  }
  animate();
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
